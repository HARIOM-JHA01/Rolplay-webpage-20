services:
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=rolplay
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SITE_URL=${SITE_URL:-https://rolplay.ai}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo_data:

        <!-- Preloader styles -->
        <style>
          #preloader {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity .5s ease;
            perspective: 1000px;
          }
          .rp-neural-sphere {
            position: relative;
            width: 120px;
            height: 120px;
            transform-style: preserve-3d;
            animation: sphere-rotate 10s linear infinite;
          }
          .rp-core {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            background: #d41e2c;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px #d41e2c, 0 0 30px rgba(212, 30, 44, 0.5);
            animation: core-pulse 2s ease-in-out infinite;
          }
          .rp-orbit {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(212, 30, 44, 0.3);
            transform-style: preserve-3d;
          }
          .rp-orbit::before,
          .rp-orbit::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #d41e2c;
            border-radius: 50%;
            box-shadow: 0 0 10px #d41e2c;
            left: 50%;
            transform: translateX(-50%);
          }
          .rp-orbit::after  { top: -4px; }
          .rp-orbit::before { bottom: -4px; }
          .rp-orbit-1 { transform: rotateY(0deg)   rotateX(45deg); animation: spin-orbit 3s linear infinite; }
          .rp-orbit-2 { transform: rotateY(60deg)  rotateX(45deg); animation: spin-orbit 3s linear infinite reverse; }
          .rp-orbit-3 { transform: rotateY(120deg) rotateX(45deg); animation: spin-orbit 4s linear infinite; }
          @keyframes sphere-rotate {
            from { transform: rotateY(0deg)   rotateX(0deg); }
            to   { transform: rotateY(360deg) rotateX(360deg); }
          }
          @keyframes spin-orbit {
            from { transform: rotateZ(0deg); }
            to   { transform: rotateZ(360deg); }
          }
          @keyframes core-pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
            50%       { transform: translate(-50%, -50%) scale(1.2); opacity: 0.7; }
          }
        </style>

        <!-- Preloader mount -->
        <script>
        (function(){
          var loaderHTML =
            '<div class="rp-neural-sphere">' +
              '<div class="rp-core"></div>' +
              '<div class="rp-orbit rp-orbit-1"></div>' +
              '<div class="rp-orbit rp-orbit-2"></div>' +
              '<div class="rp-orbit rp-orbit-3"></div>' +
            '</div>';

          function mount(){
            var pre = document.createElement('div');
            pre.id = 'preloader';
            pre.innerHTML = loaderHTML;
            document.body.appendChild(pre);

            var minShow = 1000, start = Date.now();
            window.addEventListener('load', function(){
              var remain = Math.max(0, minShow - (Date.now() - start));
              setTimeout(function(){
                pre.style.opacity = '0';
                setTimeout(function(){ pre.style.display = 'none'; }, 500);
              }, remain);
            });
          }

          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', mount);
          } else {
            mount();
          }
        })();
        </script>
